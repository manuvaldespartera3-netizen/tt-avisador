name: Explorar ligas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Explorar formato de las ligas
        env:
          ZYLA_API_KEY: ${{ secrets.ZYLA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: python tt_explorar.py

      - name: Guardar resultado
        if: always()
        run: |
          if [ -f backtest/exploracion.txt ]; then
            git config user.name "tt-avisador"
            git config user.email "tt-avisador@users.noreply.github.com"
            git add backtest/exploracion.txt
            git commit -m "Exploracion de ligas" || true
            git pull --rebase || true
            git push || true
          fi
