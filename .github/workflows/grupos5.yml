name: Comprobar grupos de 5

# Liga Pro: comprueba con datos reales de BetsAPI (ultimos 60 dias) que los grupos
# de 4 no cambian, cuantos grupos de 5 se forman, si el bot acierta quien pasa a
# la final y que picks habria dado en ellos. Solo lee: no toca el avisador.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          FUENTE_DATOS: "betsapi"
          TT_TOURNAMENT_ID: "19039"
          TT_TIEBREAK: "ligapro"
          GRUPOS5: "1"
          DIAS: "60"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_LP || secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: python tt_grupos5.py

      - name: Guardar resultado
        if: always()
        run: |
          git config user.name "tt-avisador"
          git config user.email "tt-avisador@users.noreply.github.com"
          git add backtest/*/grupos5.txt 2>/dev/null || true
          git commit -m "Comprobar grupos de 5" || exit 0
          git pull --rebase || true
          git push || true

