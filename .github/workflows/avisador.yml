name: Avisador TT Cup

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: avisador
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar memoria
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Ejecutar avisador
        env:
          ZYLA_API_KEY: ${{ secrets.ZYLA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          TEST_MODE: ${{ vars.TEST_MODE || '1' }}
        run: python tt_alerts.py

      - name: Guardar memoria
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      - name: Guardar historial de picks
        if: always()
        run: |
          if [ -f picks.csv ] && [ -n "$(git status --porcelain picks.csv)" ]; then
            git config user.name "tt-avisador"
            git config user.email "tt-avisador@users.noreply.github.com"
            git add picks.csv
            git commit -m "Historial de picks"
            git pull --rebase || true
            git push || true
          fi
