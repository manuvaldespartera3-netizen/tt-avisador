name: Avisador TT Cup

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: avisador
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # siempre la version MAS RECIENTE de main (no la del momento en que se
      # pidio la ejecucion): asi nunca se trabaja con un picks.csv atrasado
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar memoria
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Ejecutar avisador
        env:
          ZYLA_API_KEY: ${{ secrets.ZYLA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          TEST_MODE: ${{ vars.TEST_MODE || '1' }}
        run: python tt_alerts.py

      - name: Guardar memoria
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      - name: Guardar historial de picks
        if: always()
        run: |
          if [ -f picks.csv ] && [ -n "$(git status --porcelain picks.csv)" ]; then
            git config user.name "tt-avisador"
            git config user.email "tt-avisador@users.noreply.github.com"
            git add picks.csv
            git commit -m "Historial de picks"
            # si alguien ha subido algo mientras tanto, se junta; en caso de choque
            # en picks.csv manda SIEMPRE el de esta ejecucion (el mas nuevo)
            if ! git pull --rebase; then
              git rebase --abort || true
              git pull --no-rebase --no-edit -X ours || true
            fi
            git push || true
          fi
