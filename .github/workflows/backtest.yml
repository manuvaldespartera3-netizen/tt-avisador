name: Historico TT Cup

on:
  workflow_dispatch:
    inputs:
      liga:
        description: "Liga a analizar"
        type: choice
        default: "TT Cup"
        options:
          - "TT Cup"
          - "Czech Liga Pro"
          - "Setka Cup"
          - "TT Elite Series"
      dias:
        description: "Dias a analizar"
        default: "90"

permissions:
  contents: write

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Elegir liga
        run: |
          case "${{ github.event.inputs.liga }}" in
            "Czech Liga Pro")  echo "TT_TOURNAMENT_ID=19039" >> $GITHUB_ENV ;;
            "Setka Cup")       echo "TT_TOURNAMENT_ID=15004" >> $GITHUB_ENV ;;
            "TT Elite Series") echo "TT_TOURNAMENT_ID=19041" >> $GITHUB_ENV ;;
            *)                 echo "TT_TOURNAMENT_ID=15005" >> $GITHUB_ENV ;;
          esac

      # lo ya descargado se guarda: si se corta, la siguiente vez sigue donde lo dejo
      - name: Recuperar descargas anteriores
        uses: actions/cache/restore@v4
        with:
          path: backtest/**/cache
          key: bt-${{ env.TT_TOURNAMENT_ID }}-${{ github.run_id }}
          restore-keys: bt-${{ env.TT_TOURNAMENT_ID }}-

      - name: Analizar historico
        env:
          ZYLA_API_KEY: ${{ secrets.ZYLA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          BT_DAYS: ${{ github.event.inputs.dias || '90' }}
        run: python tt_backtest.py

      - name: Guardar descargas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backtest/**/cache
          key: bt-${{ env.TT_TOURNAMENT_ID }}-${{ github.run_id }}

      - name: Avisar si falla
        if: failure() || cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${MY_CHAT_ID}" \
            --data-urlencode "text=⚠️ El histórico de ${{ github.event.inputs.liga }} se ha cortado. Vuelve a lanzarlo: seguirá donde lo dejó." > /dev/null

      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "tt-avisador"
          git config user.email "tt-avisador@users.noreply.github.com"
          git add $(find backtest -path '*/cache' -prune -o -type f \( -name '*.txt' -o -name '*.csv' -o -name '*.json' \) -print) || true
          git commit -m "Informe historico ${{ github.event.inputs.liga }}" || true
          git pull --rebase || true
          git push || true
